name: macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: |
          plutil -lint dist/RayNote.app/Contents/Info.plist
          codesign --verify --strict dist/RayNote.app
          cmp LICENSE dist/RayNote.app/Contents/Resources/LICENSE
